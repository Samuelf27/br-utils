name: Publish to npm

# Publica no npm automaticamente ao criar uma tag (ex.: v1.0.0).
# Requer o secret NPM_TOKEN configurado no repositório.
# Disparo MANUAL, nao mais por tag.
#
# A conta npm exige token granular com bypass de 2FA para publicar, e enquanto
# isso nao estiver configurado o job falha com 403 — sujando de vermelho toda
# tag criada para uma Release do GitHub (que nao tem relacao com o npm).
#
# Para publicar: aba Actions -> "Publish to npm" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
